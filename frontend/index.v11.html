:root{
 --bg:#f6f5fb;--panel:#fff;--ink:#171321;--muted:#6f687b;--line:#e8e3f0;
 --purple:#5b2bbf;--purple2:#7b4ce2;--soft:#f0eaff;--soft2:#faf8ff;
 --green:#159a62;--red:#d83a61;--amber:#c77a13;--blue:#2876d8;
 --shadow:0 16px 50px rgba(48,26,89,.10);--radius:20px
}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
button,input,textarea,select{font:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.55}
.hidden{display:none!important}.app{min-height:100vh}.topbar{height:70px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:18px;padding:0 24px;position:sticky;top:0;z-index:20}
.brand{display:flex;align-items:center;gap:11px;min-width:220px}.brand img{width:44px;height:44px;border-radius:13px;object-fit:cover;box-shadow:0 6px 18px rgba(91,43,191,.16)}.brand-name{font-weight:900;letter-spacing:-.04em}.brand-sub{font-size:10px;color:var(--muted);margin-top:1px}.menu-btn{display:none;background:var(--soft);border-radius:12px;padding:9px 12px}
.layout{display:grid;grid-template-columns:255px 1fr;min-height:calc(100vh - 70px)}

.role-box{padding:12px;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.07);border-radius:16px;margin-bottom:15px;color:#fff}.role-box small{color:#d9d0f4;display:block;font-size:10px;text-transform:uppercase;letter-spacing:.12em;font-weight:800}.role-box strong{display:block;margin-top:4px}.role-box select{width:100%;margin-top:9px;border:1px solid rgba(255,255,255,.18);border-radius:10px;background:#fff;padding:8px;color:#20133d}
.nav-title{font-size:10px;color:#cfc4ec;font-weight:900;letter-spacing:.13em;text-transform:uppercase;padding:12px 10px 7px}.nav button{width:100%;text-align:left;border:0;background:transparent;padding:11px 12px;border-radius:12px;color:#f4f0ff;display:flex;align-items:center;gap:11px;margin:2px 0;font-weight:700}.nav button:hover{background:rgba(255,255,255,.10)}.nav button.active{background:#7132e2;color:#fff;box-shadow:0 8px 20px rgba(0,0,0,.12)}.nav .ico{width:22px;text-align:center;font-size:16px}.side-bottom{margin-top:18px;padding-top:15px;border-top:1px solid rgba(255,255,255,.18)}.signout{width:100%;padding:10px;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.07);border-radius:11px;color:#f4f0ff;font-weight:700}.signout:hover{background:rgba(255,255,255,.12)}
.main{min-width:0;padding:28px clamp(16px,3vw,38px) 45px}.page{max-width:1320px;margin:auto}.page-head{display:flex;justify-content:space-between;gap:15px;align-items:flex-end;margin-bottom:22px}.eyebrow{font-size:10px;text-transform:uppercase;letter-spacing:.15em;color:var(--purple);font-weight:900}.page h1{font-size:clamp(25px,3vw,36px);letter-spacing:-.045em;margin:5px 0}.page-head p{margin:0;color:var(--muted);font-size:13px}.actions{display:flex;gap:9px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:12px;padding:10px 14px;font-weight:800}.btn.primary{background:var(--purple);border-color:var(--purple);color:#fff;box-shadow:0 8px 22px rgba(91,43,191,.18)}.btn.soft{background:var(--soft);border-color:#ddd4fa;color:var(--purple)}.btn.danger{color:var(--red)}.grid{display:grid;gap:16px}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 8px 35px rgba(48,26,89,.04);padding:19px}.card h3{margin:0 0 7px;font-size:15px}.muted{color:var(--muted)}.stat{min-height:130px}.stat .label{font-size:11px;color:var(--muted);font-weight:800}.stat .value{font-size:29px;font-weight:900;letter-spacing:-.05em;margin-top:9px}.trend{font-size:11px;font-weight:800;margin-top:5px}.up{color:var(--green)}.warn{color:var(--amber)}.down{color:var(--red)}
.progress{height:8px;background:#eeeaf4;border-radius:99px;overflow:hidden}.progress>i{display:block;height:100%;background:linear-gradient(90deg,var(--purple),var(--purple2));border-radius:99px}.bar-row{display:flex;justify-content:space-between;gap:12px;font-size:12px;font-weight:800;margin:12px 0 6px}.chip{display:inline-flex;align-items:center;padding:5px 8px;border-radius:999px;background:var(--soft);color:var(--purple);font-size:10px;font-weight:900}.hero{background:linear-gradient(135deg,#21123c,#5b2bbf 60%,#8b5cf6);color:#fff;border-radius:24px;padding:25px;position:relative;overflow:hidden;box-shadow:0 18px 45px rgba(68,33,125,.18)}.hero:after{content:"";position:absolute;width:230px;height:230px;border:1px solid #ffffff25;border-radius:50%;right:-70px;top:-90px;box-shadow:0 0 0 35px #ffffff08,0 0 0 70px #ffffff05}.hero h2{font-size:28px;letter-spacing:-.04em;margin:5px 0 8px}.hero p{max-width:650px;color:#eee7ff;font-size:13px}.hero .btn{background:#fff;border-color:#fff;color:#45218d}.hero-grid{display:grid;grid-template-columns:1fr auto;gap:20px;align-items:center}.metric-row{display:flex;gap:12px;flex-wrap:wrap;margin-top:18px}.mini{background:#ffffff14;border:1px solid #ffffff22;padding:10px 13px;border-radius:13px}.mini b{display:block;font-size:18px}.mini span{font-size:10px;color:#e9ddff}
.list{display:grid;gap:9px}.item{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px;border:1px solid var(--line);border-radius:14px;background:#fff}.item-left{display:flex;gap:11px;align-items:center}.iconbox{width:38px;height:38px;border-radius:11px;background:var(--soft);display:grid;place-items:center}.item strong{font-size:12px}.item small{display:block;color:var(--muted);margin-top:2px}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.day{min-height:78px;border:1px solid var(--line);border-radius:10px;padding:8px;background:#fff}.day b{font-size:10px}.day span{display:block;margin-top:9px;font-size:10px;color:var(--muted)}.day.today{border:2px solid var(--purple);background:var(--soft)}
textarea,input[type=text],input[type=email],input[type=password]{width:100%;border:1px solid var(--line);background:#fff;border-radius:13px;padding:12px 13px;outline:none}.field{display:grid;gap:7px}.field label{font-size:11px;font-weight:900;color:#61596b;text-transform:uppercase;letter-spacing:.08em}.field input:focus,.field textarea:focus{border-color:var(--purple);box-shadow:0 0 0 3px #5b2bbf14}
.tutor{display:grid;grid-template-columns:245px 1fr;gap:16px;min-height:620px}.tutor-side,.chat{background:#fff;border:1px solid var(--line);border-radius:20px}.tutor-side{padding:14px}.mode{width:100%;border:1px solid transparent;background:transparent;text-align:left;padding:11px;border-radius:12px;margin:3px 0}.mode.active{background:var(--soft);border-color:#dfd6fb;color:var(--purple);font-weight:900}.chat{display:flex;flex-direction:column;overflow:hidden}.chat-head{padding:15px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}.messages{flex:1;padding:20px;overflow:auto;display:grid;align-content:start;gap:12px;min-height:380px;background:linear-gradient(#fff,#fcfbff)}.bubble{max-width:78%;padding:12px 14px;border-radius:16px;font-size:13px;line-height:1.55;white-space:pre-wrap}.bot{background:var(--soft2);border:1px solid var(--line);justify-self:start}.user{background:var(--purple);color:#fff;justify-self:end}.composer{padding:12px;border-top:1px solid var(--line);display:flex;gap:8px}.composer input{flex:1;border:1px solid var(--line);border-radius:13px;padding:12px}.suggestions{display:flex;gap:7px;flex-wrap:wrap;padding:0 18px 12px}.suggestions button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 9px;font-size:10px}
.upload{border:2px dashed #d8ccef;background:#fbf9ff;border-radius:18px;padding:25px;text-align:center}.upload input{display:none}.preview{max-width:100%;max-height:240px;border-radius:14px;margin:15px auto;display:block}.answer{border-left:4px solid var(--purple);background:var(--soft2);padding:15px;border-radius:12px;line-height:1.6;font-size:13px}
.quiz-question{font-size:20px;font-weight:900;letter-spacing:-.025em;margin:14px 0}.options{display:grid;gap:9px}.option{padding:13px;border:1px solid var(--line);background:#fff;border-radius:13px;text-align:left}.option:hover{border-color:var(--purple);background:var(--soft2)}.option.correct{border-color:var(--green);background:#edf9f3}.option.wrong{border-color:var(--red);background:#fff0f3}
.table{width:100%;border-collapse:collapse;font-size:12px}.table th,.table td{text-align:left;padding:12px;border-bottom:1px solid var(--line)}.table th{color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.08em}

.login{padding:24px!important;background:radial-gradient(circle at 15% 18%,#4b248b 0,#211047 28%,#0c0624 72%,#060314 100%)!important;position:relative;overflow:hidden}.login:before{content:"";position:absolute;inset:0;background-image:radial-gradient(#fff 1px,transparent 1.5px),radial-gradient(#bda4ff 1px,transparent 1.5px);background-size:78px 78px,127px 127px;background-position:10px 20px,45px 75px;opacity:.18;pointer-events:none}.login-card{position:relative;z-index:1;width:min(1120px,100%);min-height:700px;border-radius:26px!important;background:#12062c!important;border:1px solid rgba(255,255,255,.12)!important;box-shadow:0 35px 110px rgba(0,0,0,.45)!important;grid-template-columns:1.02fr .98fr!important}.login-left{background:radial-gradient(circle at 18% 30%,rgba(52,189,255,.42),transparent 18%),radial-gradient(circle at 78% 20%,rgba(111,74,224,.45),transparent 22%),linear-gradient(150deg,#13052f,#260b5c 55%,#0c0624)!important;padding:52px!important}.login-logo img{width:66px!important;height:66px!important;border-radius:18px!important}.login-left h1{font-size:47px!important;margin:105px 0 15px!important;color:#fff}.login-left p{color:#d9d0ed!important}.orbit-points span{background:rgba(255,255,255,.07)!important;border-color:rgba(255,255,255,.12)!important;backdrop-filter:blur(8px)}.login-right{background:#fdfcff!important;padding:58px!important}.auth{max-width:420px}.auth h2{font-size:31px!important}.auth input{height:48px!important;border-radius:12px!important}.auth .btn.primary{height:48px!important;border-radius:12px!important}.social-stack{display:grid;gap:10px;margin:18px 0}.social-btn{height:50px;border:1px solid #d9d3e3;background:#fff;border-radius:12px;display:flex;align-items:center;justify-content:center;gap:12px;font-weight:700;color:#1f1a29;transition:.18s;position:relative;padding:0 18px;box-shadow:0 1px 2px rgba(31,26,41,.03)}.social-btn:hover{border-color:#bba7df;background:#faf7ff;transform:translateY(-1px);box-shadow:0 6px 18px rgba(76,42,160,.08)}.social-btn:active{transform:translateY(0)}.social-icon{position:absolute;left:16px;width:22px;height:22px;display:grid;place-items:center}.social-icon img{width:20px;height:20px;display:block;object-fit:contain}.social-btn .social-label{line-height:1}.auth-divider{display:flex;align-items:center;gap:10px;color:#9a91a6;font-size:10px;margin:18px 0}.auth-divider:before,.auth-divider:after{content:"";height:1px;background:#e8e1ef;flex:1}.password-wrap{position:relative}.password-wrap input{padding-right:44px!important}.password-eye{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:34px;height:34px;border:0;background:transparent;color:#7b7188;display:grid;place-items:center;border-radius:8px}.password-eye:hover{background:#f3eef9;color:var(--purple)}.password-eye svg{width:18px;height:18px}.orbit-app,.orbit-layout,.orbit-sidebar,.orbit-main,.orbit-topbar,.orbit-side-brand,.orbit-side-brand img,.main-inner{animation:none!important}.orbit-side-brand img{will-change:auto!important}.orbit-nav button{min-height:45px!important;font-size:13.5px!important}.orbit-nav button span{font-weight:700}

/* V10 interaction polish */
.more-menu{transform-origin:bottom left;animation:moreMenuIn .18s cubic-bezier(.2,.8,.2,1) both}
.more-menu[hidden]{display:none!important}
@keyframes moreMenuIn{from{opacity:0;transform:translateY(10px) scale(.96)}to{opacity:1;transform:none}}
.more-menu button{transition:background .16s ease,transform .16s ease}
.more-menu button:hover{transform:translateX(2px)}
.chat-history .history-item{position:relative;padding-right:38px}
.history-open{width:100%;border:0;background:transparent;text-align:left;padding:0;color:inherit;cursor:pointer}
.chat-delete{position:absolute;right:7px;top:50%;transform:translateY(-50%);width:28px;height:28px;border:0;border-radius:8px;background:transparent;color:#9b91aa;display:grid;place-items:center;opacity:0;transition:.16s ease;cursor:pointer}
.history-item:hover .chat-delete,.history-item.active .chat-delete{opacity:1}
.chat-delete:hover{background:#ffecef;color:#b32649}
.recording-indicator{display:flex;align-items:center;gap:10px;padding:8px 14px;border-top:1px solid #eadff7;background:linear-gradient(90deg,#fff7fa,#faf6ff);color:#a1264b;font-size:11px;font-weight:800}
.recording-dot{width:9px;height:9px;border-radius:50%;background:#e13c68;box-shadow:0 0 0 0 rgba(225,60,104,.4);animation:recordDot 1.15s infinite}
.recording-bars{display:flex;align-items:center;gap:3px;height:18px}
.recording-bars i{display:block;width:3px;border-radius:4px;background:#e13c68;animation:recordBars .8s ease-in-out infinite}
.recording-bars i:nth-child(1){height:7px}.recording-bars i:nth-child(2){height:14px;animation-delay:.12s}.recording-bars i:nth-child(3){height:10px;animation-delay:.22s}.recording-bars i:nth-child(4){height:16px;animation-delay:.32s}.recording-bars i:nth-child(5){height:8px;animation-delay:.42s}
@keyframes recordDot{50%{box-shadow:0 0 0 7px rgba(225,60,104,.08)}}
@keyframes recordBars{50%{transform:scaleY(.45);opacity:.65}}
.mic-btn.recording{position:relative;box-shadow:0 0 0 4px rgba(225,60,104,.08),0 7px 18px rgba(225,60,104,.12)!important}
.workspace-delete{margin-top:12px;display:flex;justify-content:flex-end}
.workspace-delete .btn{font-size:10px}
</style>

const cleanText=s=>String(s??'').replace(/&amp;/gi,'&').replace(/&quot;/gi,'"').replace(/&#39;/gi,"'").replace(/&lt;/gi,'<').replace(/&gt;/gi,'>');
const esc=s=>cleanText(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const isAdmin=()=>state.user?.role==='ADMIN';
function initials(){return (state.user?.name||'U').split(/\s+/).map(x=>x[0]).join('').slice(0,2).toUpperCase()}
function toast(msg,type='info'){const e=document.createElement('div');e.className='toast';e.textContent=msg;document.body.appendChild(e);setTimeout(()=>e.remove(),2800)}
function fmtDate(v){if(!v)return '—';const d=new Date(v);return isNaN(d)?'—':d.toLocaleString(undefined,{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'})}
function fmtSize(n){n=Number(n||0);if(!n)return '0 B';const u=['B','KB','MB','GB'];let i=0;while(n>=1024&&i<3){n/=1024;i++}return `${n.toFixed(i?1:0)} ${u[i]}`}
async function api(path,opts={}){const o={method:opts.method||'GET',headers:{...(opts.headers||{})}};if(state.token)o.headers.Authorization=`Bearer ${state.token}`;if(opts.body!==undefined){if(opts.body instanceof FormData)o.body=opts.body;else{o.headers['Content-Type']='application/json';o.body=JSON.stringify(opts.body)}}const r=await fetch(API_BASE+path,o);const data=await r.json().catch(()=>({}));if(!r.ok)throw new Error(data.error||data.message||`Request failed (${r.status})`);return data}
async function apiBlob(path){const r=await fetch(API_BASE+path,{headers:{Authorization:`Bearer ${state.token}`}});if(!r.ok)throw new Error('Unable to open this file');return r.blob()}
function setSession(data){state.token=data.token||state.token;state.user=data.user;localStorage.setItem('tars_token',state.token);localStorage.setItem('tars_user',JSON.stringify(state.user))}
function clearSession(){state.token='';state.user=null;localStorage.removeItem('tars_token');localStorage.removeItem('tars_user');localStorage.removeItem('tars_workspace')}

function login(){document.getElementById('root').innerHTML=`<main class="login"><section class="login-card"><div class="login-left"><div class="login-logo">${logoMarkup()}<div><b>TARS ORBIT</b><div style="font-size:10px;color:#e6d8ff">Grow At Your Own Space</div></div></div><h1>Learning that moves at your pace.</h1><p>A personal learning operating system where your materials, courses, T.A.R.S. tutor, assessments and progress stay connected.</p><div class="orbit-points"><span>${icon('spark')} Personal AI Tutor</span><span>${icon('book')} In-app Courses</span><span>${icon('folder')} Subject Workspaces</span><span>${icon('assessment')} Adaptive Assessment</span></div></div><div class="login-right"><form class="auth" onsubmit="doLogin(event)"><div class="eyebrow">Welcome back</div><h2>Sign in to TARS ORBIT</h2><p>Continue your learning orbit from where you left off.</p><div class="field"><label>Email address</label><input id="email" type="email" placeholder="you@example.com" autocomplete="email" required></div>${passwordField('password','Password','Enter your password')}<div class="auth-row"><label class="check"><input type="checkbox"> Remember me</label><span>Secure local account</span></div><button id="loginBtn" class="btn primary" type="submit">Continue to TARS ORBIT</button>${socialButtons()}<div style="margin-top:15px;text-align:center;font-size:11px;color:var(--muted)">New here? <button type="button" class="btn soft" style="padding:7px 10px;font-size:10px" onclick="showSignup()">Create account</button></div></form></div></section></main>`}
function showSignup(){document.getElementById('root').innerHTML=`<main class="login"><section class="login-card"><div class="login-left"><div class="login-logo">${logoMarkup()}<div><b>TARS ORBIT</b><div style="font-size:10px;color:#e6d8ff">Grow At Your Own Space</div></div></div><h1>Build your own learning orbit.</h1><p>Create one account and learn inside TARS ORBIT with structured courses, real module content, daily practice, assessment and your AI tutor.</p><div class="orbit-points"><span>${icon('lock')} Secure account</span><span>${icon('book')} Structured learning</span><span>${icon('sparkles')} AI study support</span><span>${icon('assessment')} Daily assessment</span></div></div><div class="login-right"><form class="auth" onsubmit="createAccount(event)"><div class="eyebrow">Get started</div><h2>Create your account</h2><p>Your course catalog, workspace and learning progress will be connected automatically.</p><div class="field"><label>Full name</label><input id="signupName" type="text" minlength="2" placeholder="Your full name" autocomplete="name" required></div><div class="field"><label>Email address</label><input id="signupEmail" type="email" placeholder="you@example.com" autocomplete="email" required></div>${passwordField('signupPassword','Password','At least 8 characters')}<div class="field"><label>Confirm password</label><input id="signupConfirm" type="password" minlength="8" placeholder="Repeat your password" autocomplete="new-password" required></div><button id="signupBtn" class="btn primary" type="submit">Create My Orbit</button>${socialButtons()}<div style="margin-top:15px;text-align:center;font-size:11px;color:var(--muted)">Already have an account? <button type="button" class="btn soft" style="padding:7px 10px;font-size:10px" onclick="login()">Back to sign in</button></div></form></div></section></main>`}
async function createAccount(e){e.preventDefault();const b=document.getElementById('signupBtn');const pw=document.getElementById('signupPassword').value;const cp=document.getElementById('signupConfirm').value;if(pw!==cp){toast('Passwords do not match','error');return}b.disabled=true;b.textContent='Creating your orbit…';try{const data=await api('/auth/signup',{method:'POST',body:{name:document.getElementById('signupName').value.trim(),email:document.getElementById('signupEmail').value.trim(),password:pw}});setSession(data);await bootstrap();toast('Account created successfully ✨')}catch(err){toast(err.message,'error')}finally{b.disabled=false;b.textContent='Create My Orbit'}}
async function doLogin(e){e.preventDefault();const b=document.getElementById('loginBtn');b.disabled=true;b.textContent='Signing in…';try{const data=await api('/auth/login',{method:'POST',body:{email:document.getElementById('email').value.trim(),password:document.getElementById('password').value}});setSession(data);await bootstrap();toast('Welcome back ✨')}catch(err){toast(err.message,'error')}finally{b.disabled=false;b.textContent='Enter My Orbit →'}}
function signOut(){clearSession();state.workspaces=[];state.materials=[];login()}
async function bootstrap(){const me=await api('/auth/profile');setSession(me);state.page=isAdmin()?'admin-users':'dashboard';await loadWorkspaces();if(!isAdmin()){if(state.workspaceId){try{await loadWorkspace()}catch{}};await loadDashboard();try{state.aiStatus=await api('/learning/ai/status')}catch{state.aiStatus=null};try{await loadCourses()}catch{};try{await loadChatSessions()}catch{}}else{await loadAdmin('admin-users')}render()}
function nav(p){state.page=p;state.sidebar=false;render();if(p==='dashboard')loadDashboard().then(render);if(p==='courses')loadCourses().then(render);if(p==='tutor')loadChatSessions().then(render);if(p==='study')loadWorkspace().then(render);if(p==='assessment')loadDashboard().then(render);if(p==='assignments')loadAssignments().then(render);if(p==='classroom')Promise.all([loadAnnouncements(),loadCourses()]).then(render);if(p==='quiz')loadQuiz().then(render);if(p==='skills')loadSkills().then(render);if(p.startsWith('admin-'))loadAdmin(p).then(render)}
function toggleSide(){state.sidebar=!state.sidebar;render()}
function pageHead(k,t,d,actions=''){return `<div class="page-head orbit-page-head"><div><div class="eyebrow">${esc(k)}</div><h1>${esc(t)}</h1><p>${esc(d)}</p></div><div class="actions">${actions}</div></div>`}
function shell(content){const learner=[['dashboard','grid','Dashboard'],['courses','book','Courses'],['study','book','Study Workspace'],['tutor','spark','T.A.R.S. Tutor'],['assignments','assessment','Assignments'],['assessment','assessment','Assessments'],['skills','skill','Skill Orbit'],['quiz','quiz','Adaptive Quiz'],['classroom','classroom','Classroom Hub']];const admin=[['admin-users','user','User Management'],['admin-content','book','Content Management'],['admin-analytics','assessment','Analytics & Reporting'],['admin-revenue','grid','Payment & Revenue'],['admin-security','shield','Security & Compliance']];const navs=isAdmin()?[['courses','book','Courses'],['tutor','spark','T.A.R.S. Tutor'],...admin]:learner;return `<div class="app orbit-app"><div class="layout orbit-layout"><aside class="sidebar orbit-sidebar ${state.sidebar?'open':''}"><div class="orbit-side-brand">${logoMarkup()}<div><div class="orbit-side-title">TARS ORBIT</div><div class="orbit-side-sub">Grow At Your Own Space</div></div></div><div class="orbit-side-section"><div class="orbit-side-label">LEARNING</div><nav class="nav orbit-nav">${navs.map(n=>`<button class="${state.page===n[0]?'active':''}" onclick="nav('${n[0]}')">${icon(n[1])}<span>${n[2]}</span></button>`).join('')}</nav></div><div class="orbit-side-bottom"><button class="nav account-nav ${state.page==='profile'?'active':''}" onclick="openProfile()">${icon('user')}<span>Profile & settings</span></button><button class="nav account-nav" onclick="signOut()">${icon('logout')}<span>Sign out</span></button></div></aside><main class="main orbit-main"><header class="orbit-topbar"><button class="orbit-mobile-menu" aria-label="Open navigation" onclick="toggleSide()">${icon('menu')}</button><div class="orbit-search">${icon('search')}<input placeholder="Search courses, topics, or ask T.A.R.S.…" onkeydown="if(event.key==='Enter'){nav('tutor');setTimeout(()=>{const i=document.getElementById('chatInput');if(i){i.value=this.value;i.focus()}} ,40)}"><span>⌘ K</span></div><div class="orbit-top-actions"><button class="orbit-profile" onclick="openProfile()"><span>${esc(initials())}</span><div><b>${esc(state.user?.name||'Learner')}</b><small>${isAdmin()?'Administrator':'Learner'}</small></div><span class="chev">${icon('chevron')}</span></button></div></header><div class="main-inner"><div class="page fade-in">${content}</div></div></main></div></div>`}
function currentWorkspace(){return state.workspaces.find(w=>w.id===state.workspaceId)||null}
function toggleWorkspaceMenu(){const m=document.getElementById('workspaceMenu');if(m)m.hidden=!m.hidden}
function selectWorkspace(id){state.workspaceId=id;localStorage.setItem('tars_workspace',id);state.page='study';render();loadWorkspace().then(render)}
async function loadWorkspaces(){if(isAdmin()){state.workspaces=[];return}const d=await api('/learning/workspaces');state.workspaces=(d.workspaces||[]).map(w=>({...w,name:cleanText(w.name),description:cleanText(w.description)}));if(state.workspaceId&&!state.workspaces.some(x=>x.id===state.workspaceId))state.workspaceId='';if(!state.workspaceId&&state.workspaces[0]){state.workspaceId=state.workspaces[0].id;localStorage.setItem('tars_workspace',state.workspaceId)}}
async function loadDashboard(){if(isAdmin())return;state.dashboard=await api('/learning/dashboard')}
async function loadCourses(){
 const raw=(await api('/courses')).courses||[];const byTitle=new Map();
 for(const c of raw){const key=String(c.title||c.id),prev=byTitle.get(key);if(!prev||Number(c.module_count||0)>Number(prev.module_count||0)||(c.enrolled&&!prev.enrolled))byTitle.set(key,c)}
 state.courses=[...byTitle.values()].map(c=>({...c,title:cleanText(c.title),description:cleanText(c.description)}));
 if(state.assignmentCourseId&&!state.courses.some(c=>c.id===state.assignmentCourseId))state.assignmentCourseId='';
 if(!state.assignmentCourseId){const first=state.courses.find(c=>c.enrolled);if(first){state.assignmentCourseId=first.id;localStorage.setItem('tars_assignment_course',first.id)}}
}
async function enrollCourse(id){try{const d=await api(`/courses/${id}/enroll`,{method:'POST',body:{}});await loadCourses();await loadWorkspaces();state.workspaceId=d.workspace.id;localStorage.setItem('tars_workspace',state.workspaceId);toast('Course enrolled — workspace created ✓');nav('study')}catch(e){toast(e.message,'error')}}
async function openCourseWorkspace(id){const c=state.courses.find(x=>x.id===id);if(!c?.enrolled){await enrollCourse(id);return}const w=state.workspaces.find(x=>x.name===c.title);if(w){selectWorkspace(w.id)}else{toast('Course workspace is being created. Enroll again if needed.','error')}}

function dashboard(){const d=state.dashboard||{workspaces:[],materials:{count:0,bytes:0},study:{minutes:0,sessions:0},courses:{count:0,avg_progress:0},assessments:{attempts:0,avg_score:0}};const w=d.workspaces||[];const enrolled=(state.courses||[]).filter(c=>c.enrolled);const first=enrolled.slice(0,3);return `<section class="orbit-hero"><div class="hero-copy"><div class="hero-kicker">YOUR LEARNING ORBIT</div><h1>Welcome back, ${esc((state.user?.name||'Learner').split(' ')[0])}! <span>👋</span></h1><p>Keep learning. Keep exploring. Grow at your own space.</p><div class="hero-quote">“The future belongs to those who learn more, build more, and keep moving.”<small>— TARS ORBIT</small></div></div><div class="goal-card"><div><b>Today's Goal</b><label><i>✓</i> Complete 3 assignments</label><label><i>○</i> Spend 1 hour learning</label><label><i>○</i> Ask 1 doubt to T.A.R.S.</label></div><div class="goal-ring"><strong>${Math.min(100,Math.round(((d.study?.minutes||0)%60)/60*100)+((d.assessments?.attempts||0)>0?20:0))}%</strong><small>Daily Progress</small></div></div></section><div class="orbit-stat-grid"><div class="orbit-stat"><div class="stat-icon">${icon('book')}</div><div><b>${d.courses.count||enrolled.length}</b><span>Courses Enrolled</span></div></div><div class="orbit-stat"><div class="stat-icon">${icon('grid')}</div><div><b>${w.length}</b><span>Workspaces</span></div></div><div class="orbit-stat"><div class="stat-icon green">${icon('assessment')}</div><div><b>${d.assessments.attempts}</b><span>Assessments Done</span></div></div><div class="orbit-stat"><div class="stat-icon blue">${icon('clock')}</div><div><b>${Math.round((d.study.minutes||0)/60)}h</b><span>Study Time</span></div></div><div class="orbit-stat"><div class="stat-icon pink">${icon('spark')}</div><div><b>${Number(d.assessments.avg_score||0).toFixed(0)}%</b><span>Average Score</span></div></div></div><div class="orbit-content-grid"><section class="orbit-panel"><div class="orbit-panel-head"><div><h2>Continue Your Learning</h2><p>Pick up where you left off.</p></div><button class="text-link" onclick="nav('courses')">View all →</button></div><div class="continue-grid">${first.map(c=>`<article class="continue-card"><div class="course-art"><img src="${courseImage(c.title)}" alt="${esc(c.title)}" loading="lazy" decoding="async"></div><div class="continue-title"><b>${esc(c.title)}</b><small>${c.module_count||0} modules · ${Number(c.progress||0)}% complete</small></div><div class="mini-progress"><i style="width:${Number(c.progress||0)}%"></i></div><button class="btn primary" onclick="openCourseWorkspace('${c.id}')">Continue Learning</button></article>`).join('')||`<article class="empty-course"><div class="empty-orbit-icon">${icon('book')}</div><div><h3>Start your first course</h3><p>Browse the catalog and enroll. Your matching workspace and daily plan are created automatically.</p></div><button class="btn primary" onclick="nav('courses')">Browse Courses</button></article>`}</div></section><aside class="orbit-panel quick-panel"><div class="orbit-panel-head"><div><h2>Quick Actions</h2><p>Jump straight into your workflow.</p></div></div><button class="quick-action" onclick="nav('tutor')"><span>${icon('spark')}</span><div><b>Ask T.A.R.S.</b><small>Get instant study help</small></div><em>→</em></button><button class="quick-action" onclick="nav('assignments')"><span>${icon('assessment')}</span><div><b>Today's learning</b><small>See your 3 daily tasks</small></div><em>→</em></button><button class="quick-action" onclick="nav('courses')"><span>${icon('book')}</span><div><b>Browse Courses</b><small>Explore new skills</small></div><em>→</em></button><button class="quick-action" onclick="nav('study')"><span>${icon('folder')}</span><div><b>My Library</b><small>Open your workspace</small></div><em>→</em></button></aside></div><div class="orbit-bottom-grid"><section class="orbit-panel"><div class="orbit-panel-head"><div><h2>Your Workspaces</h2><p>Organize your learning by subject.</p></div><button class="btn soft" onclick="openNewWorkspace()">＋ New workshop</button></div>${w.length?`<div class="workspace-cards">${w.slice(0,4).map(x=>`<button class="workspace-card" onclick="selectWorkspace('${x.id}')"><span>${icon('folder')}</span><div><b>${esc(x.name)}</b><small>${x.material_count||0} materials · ${x.study_minutes||0} study min</small></div><em>→</em></button>`).join('')}</div>`:`<div class="empty compact-empty"><h3>No workspace yet</h3><p>Create a subject workspace or enroll in a course.</p><button class="btn primary" onclick="openNewWorkspace()">Create workspace</button></div>`}</section><section class="orbit-panel activity-panel"><div class="orbit-panel-head"><div><h2>Your Activity</h2><p>Live account progress.</p></div></div><div class="activity-orbit"><div><b>${d.courses.count}</b><span>Courses</span></div><div><b>${d.assessments.attempts}</b><span>Attempts</span></div><div><b>${d.study.sessions}</b><span>Study Sessions</span></div></div><div class="activity-note">Your dashboard updates as you learn, upload resources, study and complete assessments.</div></section></div>`}

async function toggleSpeech(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){toast('Voice dictation is not supported in this browser. Use the latest Chrome or Edge.','error');return}
  if(state.speech){state.speechStopRequested=true;try{state.speech.stop()}catch{}return}
  if(navigator.mediaDevices?.getUserMedia){try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});stream.getTracks().forEach(t=>t.stop())}catch(e){toast('Microphone permission was denied. Allow microphone access for this site and try again.','error');return}}
  state.speechStopRequested=false;state.speechBase=document.getElementById('chatInput')?.value?.trim()||'';state.speechFinal='';
  startSpeechRecognition(SR,true);
}
function startSpeechRecognition(SR,announce){
  const r=new SR();r.lang='en-IN';r.continuous=true;r.interimResults=true;r.maxAlternatives=1;
  state.speech=r;if(announce){setSpeechUI(true);render()}
  r.onresult=e=>{
    let finalText='',interimText='';
    for(let n=e.resultIndex;n<e.results.length;n++){const t=e.results[n][0]?.transcript||'';if(e.results[n].isFinal)finalText+=' '+t;else interimText+=' '+t}
    if(finalText)state.speechFinal=(state.speechFinal+' '+finalText).trim();
    const value=[state.speechBase,state.speechFinal,interimText].filter(Boolean).join(' ').replace(/\s+/g,' ').trim();
    const i=document.getElementById('chatInput');if(i){i.value=value;i.focus()}
  };
  r.onerror=e=>{if(e.error==='no-speech'||e.error==='aborted')return;if(!state.speechStopRequested){toast(`Microphone error: ${e.error||'unable to recognize speech'}`,'error')}state.speech=null;setSpeechUI(false);render()};
  r.onend=()=>{
    if(state.speech!==r)return;
    if(state.speechStopRequested){state.speech=null;setSpeechUI(false);render();return}
    // Browsers can end SpeechRecognition after a silence/network boundary. Restart it
    // automatically so the learner can keep dictating until they press the mic button.
    setTimeout(()=>{if(state.speech===r&&!state.speechStopRequested)startSpeechRecognition(SR,false)},120);
  };
  try{r.start()}catch(e){state.speech=null;setSpeechUI(false);toast('Unable to start microphone. Check browser microphone permissions.','error');render()}
}

function startFocus(){if(state.focusTimer){toast('Focus session already running');return}if(!state.workspaceId){toast('Select a workspace first','error');return}let seconds=0;state.focusStartedAt=Date.now();const id=setInterval(()=>{seconds++;const el=document.getElementById('focusStatus');if(el)el.textContent=`Focus session · ${String(Math.floor(seconds/60)).padStart(2,'0')}:${String(seconds%60).padStart(2,'0')}`},1000);state.focusTimer={id,secondsRef:()=>seconds};document.body.insertAdjacentHTML('beforeend',`<div class="modal-back" id="focusModal"><div class="modal"><div class="modal-head"><h3>Focus session</h3><button class="close" onclick="stopFocus()">✕</button></div><div id="focusStatus" style="font-size:34px;font-weight:900;text-align:center;padding:28px 0">Focus session · 00:00</div><p class="muted" style="text-align:center">Work on ${esc(currentWorkspace()?.name||'this workspace')} and stop when you're done.</p><div class="modal-actions"><button class="btn primary" onclick="stopFocus()">Finish session</button></div></div></div>`)}

 const list=(state.courses||[]);const enrolled=list.filter(c=>c.enrolled);const selected=state.lesson?.courseTitle||enrolled[0]?.title||list[0]?.title;const c=list.find(x=>x.title===selected)||list[0];
 const modules=(c?.modules||[]);return pageHead('Measure & improve','Assessments','Review your assessment record and open real course modules for structured learning.',`<button class="btn primary" onclick="nav('quiz')">${icon('quiz')} Take daily quiz</button>`)+`<div class="grid g3"><div class="card stat"><div class="label">ATTEMPTS</div><div class="value">${state.dashboard?.assessments?.attempts||0}</div></div><div class="card stat"><div class="label">AVERAGE SCORE</div><div class="value">${Number(state.dashboard?.assessments?.avg_score||0).toFixed(1)}%</div></div><div class="card stat"><div class="label">STUDY MINUTES</div><div class="value">${state.dashboard?.study?.minutes||0}</div></div></div><section class="card assessment-learning" style="margin-top:16px"><div class="section-head"><div><div class="eyebrow">REAL COURSE CONTENT</div><h3>Learning modules</h3><p class="muted">Choose a course and open any module to enter the learning phase.</p></div><select class="compact-select" onchange="state.lesson={courseTitle:this.value,moduleNo:1};render()">${list.map(x=>`<option value="${esc(x.title)}" ${x.title===selected?'selected':''}>${esc(x.title)}</option>`).join('')}</select></div><div class="assessment-modules">${modules.map(m=>{const d=contentForModule(c.title,Number(m.module_no),m.title);return `<button class="assessment-module" onclick="openLesson(decodeURIComponent('${encodeURIComponent(c.title)}'),${Number(m.module_no)})"><span class="module-number">${m.module_no}</span><span><b>${esc(m.title)}</b><small>${esc(d[1])}</small></span><span class="module-arrow">${icon('chevron')}</span></button>`}).join('')}</div></section>`;

async function changeRole(id,role){try{await api(`/admin/users/${id}/role`,{method:'PATCH',body:{role}});toast('Role updated');await loadAdmin('admin-users');render()}catch(e){toast(e.message,'error')}}

function openProfile(){const u=state.user||{};document.body.insertAdjacentHTML('beforeend',`<div class="modal-back" id="profileModal"><div class="modal profile-modal"><div class="modal-head"><div><div class="eyebrow">Account</div><h3>Profile & settings</h3></div><button class="close" onclick="this.closest('.modal-back').remove()">✕</button></div><div class="profile-grid"><div class="field rounded-field"><label>Full name</label><input id="pName" value="${esc(u.name)}"></div><div class="field rounded-field"><label>Email</label><input id="pEmail" value="${esc(u.email)}" readonly></div><div class="field rounded-field"><label>Phone</label><input id="pPhone" value="${esc(u.phone||'')}" placeholder="+91 …"></div><div class="field rounded-field"><label>Institution / company</label><input id="pInstitution" value="${esc(u.institution||'')}" placeholder="College, university or company"></div><div class="field full"><label>About me</label><textarea id="pBio" rows="5" placeholder="Tell TARS ORBIT about your goals…">${esc(u.bio||'')}</textarea></div></div><div class="security-row"><div><b>Password & security</b><small>Update your sign-in password.</small></div><button class="btn soft" onclick="openPassword()">Change password</button></div><div class="modal-actions"><button class="btn" onclick="this.closest('.modal-back').remove()">Cancel</button><button class="btn primary" onclick="saveProfile()">Save changes</button></div></div></div>`)}
async function saveProfile(){try{const d=await api('/auth/profile',{method:'PUT',body:{fullName:document.getElementById('pName').value.trim(),email:state.user.email,phone:document.getElementById('pPhone').value.trim(),institution:document.getElementById('pInstitution').value.trim(),bio:document.getElementById('pBio').value.trim()}});setSession({user:d.user,token:state.token});document.getElementById('profileModal').remove();toast('Profile updated ✓');render()}catch(e){toast(e.message,'error')}}
function openPassword(){document.body.insertAdjacentHTML('beforeend',`<div class="modal-back" id="passModal"><div class="modal"><div class="modal-head"><h3>Change password</h3><button class="close" onclick="this.closest('.modal-back').remove()">✕</button></div><div class="field"><label>Current password</label><input id="oldPass" type="password"></div><div class="field"><label>New password</label><input id="newPass" type="password" minlength="8"></div><div class="field"><label>Confirm new password</label><input id="confirmPass" type="password" minlength="8"></div><div class="modal-actions"><button class="btn" onclick="this.closest('.modal-back').remove()">Cancel</button><button class="btn primary" onclick="changePassword()">Update password</button></div></div></div>`)}
async function changePassword(){const a=document.getElementById('oldPass').value,b=document.getElementById('newPass').value,c=document.getElementById('confirmPass').value;if(b!==c){toast('New passwords do not match','error');return}try{await api('/auth/change-password',{method:'POST',body:{currentPassword:a,newPassword:b,confirmPassword:c}});document.getElementById('passModal').remove();toast('Password changed successfully ✓')}catch(e){toast(e.message,'error')}}
function openQuick(){document.body.insertAdjacentHTML('beforeend',`<div class="modal-back" id="quick"><div class="modal"><div class="modal-head"><h3>Quick action</h3><button class="close" onclick="this.closest('.modal-back').remove()">✕</button></div><div class="grid g2" style="margin-top:16px"><button class="item action-card" onclick="this.closest('.modal-back').remove();nav('tutor')">${icon('spark')}<strong>Ask T.A.R.S.</strong><small>Open your tutor</small></button><button class="item action-card" onclick="this.closest('.modal-back').remove();openScanner()">${icon('upload')}<strong>Scan question</strong><small>Upload a question image</small></button><button class="item action-card" onclick="this.closest('.modal-back').remove();openUpload()">${icon('book')}<strong>Add material</strong><small>Save to your library</small></button><button class="item action-card" onclick="this.closest('.modal-back').remove();openNewWorkspace()">${icon('plus')}<strong>New workshop</strong><small>Create a subject orbit</small></button></div></div></div>`)}
function updateClock(){const e=document.getElementById('clock');if(e)e.textContent=new Intl.DateTimeFormat('en-IN',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit',hour12:true}).format(new Date())}
setInterval(updateClock,1000);
document.addEventListener('pointerdown',e=>{const menu=document.getElementById('moreMenu');if(menu&&!menu.hidden&&!e.target.closest('.more-wrap'))closeMoreMenu()});

function render(){if(!state.user){login();return}let c;if(state.page==='dashboard')c=dashboard();else if(state.page==='courses')c=courses();else if(state.page==='tutor')c=tutor();else if(state.page==='study')c=study();else if(state.page==='assignments')c=assignments();else if(state.page==='assessment')c=assessment();else if(state.page==='lesson')c=lesson();else if(state.page==='skills')c=skills();else if(state.page==='quiz')c=quizPage();else if(state.page==='classroom')c=classroom();else if(state.page.startsWith('admin-'))c=adminPage(state.page,'','');else c=dashboard();const root=document.getElementById('root');const app=root.querySelector('.orbit-app');if(app){const page=app.querySelector('.main-inner .page');if(page)page.outerHTML=`<div class="page fade-in">${c}</div>`;app.querySelectorAll('.orbit-nav button').forEach(b=>b.classList.toggle('active',b.getAttribute('onclick')===`nav('${state.page}')`));}else root.innerHTML=shell(c);updateClock();if(state.page==='tutor'){setTimeout(()=>{const m=document.getElementById('messages');if(m)m.scrollTop=m.scrollHeight},0)}}
async function init(){const saved=localStorage.getItem('tars_user');if(state.token&&saved){try{state.user=JSON.parse(saved);await bootstrap();return}catch{clearSession()}}render()}
init();
if('serviceWorker' in navigator){
  const devHost=['localhost','127.0.0.1','::1'].includes(location.hostname);
  window.addEventListener('load',async()=>{
    if(devHost){
      const key='tars_orbit_sw_reset_v11';
      try{
        const regs=await navigator.serviceWorker.getRegistrations();
        await Promise.all(regs.map(r=>r.unregister()));
        const keys=await caches.keys();
        await Promise.all(keys.map(k=>caches.delete(k)));
        if(!sessionStorage.getItem(key)){sessionStorage.setItem(key,'1');location.reload();}
      }catch{}
      return;
    }
    navigator.serviceWorker.register('sw.js?v=11',{updateViaCache:'none'}).then(r=>r.update()).catch(()=>{});
  });
}
</script>

document.addEventListener('error',e=>{const img=e.target;if(img&&img.classList?.contains('course-image')){img.style.display='none';img.parentElement.style.background='linear-gradient(135deg,#171042,#6932d9)'}},true);
</script>
